buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://maven.parchmentmc.org' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '[6.0.16,6.2)', changing: true
        classpath 'org.parchmentmc:librarian:1.+'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.parchmentmc.librarian.forgegradle'
apply plugin: 'java'
apply plugin: 'idea'
apply plugin: 'eclipse'

version = mod_version
group = 'com.github.eileen'
archivesBaseName = 'tlmtrumpet'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    // Same mappings as Touhou Little Maid so sources line up when cross-referencing.
    mappings channel: 'parchment', version: '2023.08.20-1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { tlmtrumpet { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { tlmtrumpet { source sourceSets.main } }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${forge_version}"
    // No compile-time dependency on Touhou Little Maid: the trumpet is resolved at
    // runtime through ForgeRegistries by its registry name, so this builds standalone.
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand 'version': project.version
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : 'tlmtrumpet',
                'Specification-Vendor'    : 'eileen',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : 'eileen'
        ])
    }
}
